name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - name: Check concurrency
        run: go test -race ./internal/...
        env:
          CGO_ENABLED: "1"
      - name: Cross-build supported targets
        run: |
          GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/pith-desk-darwin-amd64" ./cmd/pith-desk
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/pith-desk-linux-amd64" ./cmd/pith-desk
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/pith-desk-linux-arm64" ./cmd/pith-desk
      - run: npm run build
