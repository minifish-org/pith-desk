name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the existing required status even for documentation-only PRs.
  mac:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Select checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/ci-scope.ts
      - uses: actions/setup-go@v6
        if: steps.scope.outputs.install == 'true'
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        if: steps.scope.outputs.install == 'true'
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules and compiled packages
        if: steps.scope.outputs.install == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          # Refresh compiled race/embedded packages after source changes too.
          key: go-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: npm ci
        if: steps.scope.outputs.install == 'true'
      - run: npm --prefix frontend ci
        if: steps.scope.outputs.install == 'true'
      - name: Check frontend and tooling
        if: steps.scope.outputs.install == 'true'
        run: npm run check:frontend
      - name: Check Go code and concurrency
        if: steps.scope.outputs.runtime == 'true'
        # Each package runs once. Reuse compiled packages, but execute tests.
        # Keep serial race execution: packages exercise their own concurrency.
        run: |
          go vet ./...
          CGO_ENABLED=1 go test -count=1 -race -p 1 ./...
      - name: Identify browser cache
        if: steps.scope.outputs.browser == 'true'
        id: browsers
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "macos=$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache browser test engines
        if: steps.scope.outputs.browser == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-macos${{ steps.browsers.outputs.macos }}-${{ steps.browsers.outputs.playwright }}
      - name: Install browser test engines
        if: steps.scope.outputs.browser == 'true'
        # Idempotent: keep cached engines and install anything missing.
        run: npx --no-install playwright install --only-shell chromium webkit
      - name: Build browser Host fixture once
        if: steps.scope.outputs.browser == 'true'
        run: go build -o "$RUNNER_TEMP/host-fixture" ./internal/testsupport/hostfixture
      - name: Check browser regressions
        if: steps.scope.outputs.browser == 'true'
        run: npm run test:ui
        env:
          PITH_DESK_HOST_FIXTURE: ${{ runner.temp }}/host-fixture
      - name: Save failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Check Linux compilation and Server packaging
        if: steps.scope.outputs.runtime == 'true'
        # Ubuntu amd64 also has release packaging and desktop acceptance.
        # Desktop arm64 remains compile-only; package both headless Server targets.
        run: |
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/pith-desk-linux-amd64" ./cmd/pith-desk
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/pith-desk-linux-arm64" ./cmd/pith-desk
          node --experimental-strip-types scripts/package-server-release.ts
