name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select runtime checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime=true
          base_sha="$(gh run list --workflow check.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')" || base_sha=
          if [ -n "$base_sha" ] && git cat-file -e "$base_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"; then
            files="$(git diff --name-only --no-renames "$base_sha" "$GITHUB_SHA")"
            if ! printf '%s\n' "$files" | grep -Eq '\.go$|^go\.(mod|sum)$|^(package(-lock)?\.json|mygo\.config\.ts)$|^(scripts/|\.github/workflows/)'; then
              runtime=false
            fi
          fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - name: Install browser test engines
        run: npx playwright install chromium webkit
      - name: Check browser regressions
        run: npm run test:ui
      - name: Save failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-traces
          path: test-results/
          if-no-files-found: ignore
      - name: Check concurrency
        if: steps.scope.outputs.runtime == 'true'
        # Packages each exercise their own concurrent execution. Run one
        # package at a time to avoid competing race-instrumented runtimes.
        run: go test -race -p 1 ./internal/...
        env:
          CGO_ENABLED: "1"
      - name: Check Linux compilation
        if: steps.scope.outputs.runtime == 'true'
        # Ubuntu amd64 also has release packaging and desktop acceptance.
        # Linux arm64 remains compile-only.
        run: |
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/pith-desk-linux-amd64" ./cmd/pith-desk
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/pith-desk-linux-arm64" ./cmd/pith-desk
