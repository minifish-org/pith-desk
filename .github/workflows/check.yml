name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - name: Check concurrency
        # Packages each exercise their own concurrent execution. Run one
        # package at a time to avoid competing race-instrumented runtimes.
        run: go test -race -p 1 ./internal/...
        env:
          CGO_ENABLED: "1"
      - name: Check Linux compilation
        # Compilation checks do not extend the supported desktop platforms.
        run: |
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/pith-desk-linux-amd64" ./cmd/pith-desk
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/pith-desk-linux-arm64" ./cmd/pith-desk
      - name: Build Apple Silicon app
        run: npm run build:mac
